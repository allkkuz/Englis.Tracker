<style>
/* Layout: one column, 720px max. A header line (name + text tabs), then screens built only from type, whitespace and hairlines.
   Monochrome on purpose: state is shown by fill density (solid / half / outline), never by colour. */
:root{
  --bg:#FFFFFF; --ink:#111316; --ink2:#43474E; --muted:#81868F; --line:#E5E7EB; --faint:#F2F3F5; --half:#A3A7AE;
  --f:"Geologica","Helvetica Neue",Helvetica,Arial,sans-serif;
  --s1:12px; --s2:14px; --s3:16px; --s4:20px; --s5:28px; --s6:clamp(56px,14vw,84px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E0F11; --ink:#ECEDEF; --ink2:#C2C5CB; --muted:#878C95; --line:#25282D; --faint:#17191C; --half:#5F636B; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#0E0F11; --ink:#ECEDEF; --ink2:#C2C5CB; --muted:#878C95; --line:#25282D; --faint:#17191C; --half:#5F636B; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--s3)/1.5 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.muted{color:var(--muted)}
.screen{display:grid;gap:40px;padding-top:28px}
h2{font:500 var(--s2)/1.3 var(--f);color:var(--muted);margin:0 0 14px}
.sub{font-size:var(--s2);color:var(--muted);margin:-6px 0 16px;max-width:60ch}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--line)}
.link:hover{text-decoration-color:currentColor}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 18px;font-weight:500;font-size:var(--s2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.brand{font-weight:500;font-size:var(--s3);margin:0}
.left{font-size:var(--s2);color:var(--muted)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:26px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;border-bottom:1.5px solid transparent;margin-bottom:-1px;padding:13px 0 12px;font-size:var(--s3);color:var(--muted);white-space:nowrap}
.nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.status{font-size:var(--s1);color:var(--muted);margin-top:10px}
.status.bad{color:var(--ink);font-weight:500}

/* today */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:end}
.hero-n{font:300 var(--s6)/.82 var(--f);letter-spacing:-.04em}
.hero-t{padding-bottom:4px;min-width:0}
.hero-t b{display:block;font:500 var(--s4)/1.2 var(--f)}
.hero-t span{font-size:var(--s2);color:var(--muted)}
.hero-nav{display:flex;gap:6px;padding-bottom:2px}
.icon{width:40px;height:40px;border:1px solid var(--line);background:transparent;border-radius:50%;display:grid;place-items:center}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}
.icon:disabled{opacity:.3;cursor:default}
.meter{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:var(--s2);color:var(--muted)}
.meter b{font-weight:500;color:var(--ink);font-size:var(--s3)}
.bar{position:relative;height:2px;background:var(--line);margin-top:10px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar u{position:absolute;top:-5px;bottom:-5px;width:1.5px;background:var(--muted)}
.list{border-top:1px solid var(--line)}
.item{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.box{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:5px;margin-top:2px;position:relative;transition:background .12s}
.item[aria-checked="true"] .box{background:var(--ink)}
.item[aria-checked="true"] .box::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid var(--bg);border-width:0 1.75px 1.75px 0;transform:rotate(45deg)}
.txt{display:grid;gap:2px;min-width:0}
.nm{font-weight:500}
.nm em{font-style:normal;font-weight:400;color:var(--muted);font-size:var(--s2)}
.rs{font-size:var(--s2);color:var(--muted);overflow-wrap:anywhere}
.mn{font-size:var(--s2);color:var(--muted);padding-top:1px;white-space:nowrap}
.item[aria-checked="true"] .mn{color:var(--ink)}
.item:disabled{cursor:default}
.dim .item .nm,.dim .item .mn{color:var(--muted)}
.more{font-size:var(--s2);color:var(--muted);padding-top:14px;line-height:1.9}
.more .link{color:var(--ink);margin-right:10px}
.notice{border:1px solid var(--line);border-radius:10px;padding:18px 18px 4px}
.notice b{font-weight:500}
.notice p{margin:4px 0 6px;font-size:var(--s2);color:var(--muted)}
.notice .item:last-child{border-bottom:0}
.notice .list{margin-top:6px}
.field{display:grid;gap:6px;font-size:var(--s2);color:var(--muted)}
.plain{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:8px 0;color:var(--ink);font-size:var(--s3);resize:vertical;min-height:40px}
textarea.plain{min-height:64px}
.plain:focus{outline:none;border-bottom-color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}

function normalize(r){

    const g = Number(c.goalScore); s.cfg.goalScore = g >= 1 && g <= 100 ? Math.round(g) : null;
    if (s.cfg.goalScore) s.cfg.goalLevel = levelOf(s.cfg.goalScore); else if (s.cfg.goalLevel) s.cfg.goalScore = GOAL_MIN[s.cfg.goalLevel];
    const cl = c.cal && typeof c.cal === "object" ? c.cal : {};

}

const dayRec = d => S.days[d] || { done:[], off:false, note:"" };

const checkMin = () => S.cfg.tests.testMin + S.cfg.tests.essayMin;
function testState(k){

const MONTH_D = 30.44;

/* ---------- dashboard ---------- */
function totals(){
  const t = todayISO(); let planAll = 0, planToDate = 0, fact = 0;
  D.days.forEach(d => { const p = planMin(d); planAll += p; if (d <= t) planToDate += p; fact += factMin(d); });
  D.checks.forEach(c => { planAll += checkMin(); if (c.win[1] < t) planToDate += checkMin(); fact += checkFact(c.k); });
  return { planAll, planToDate, fact };
}
function streak(){
  const t = todayISO(); if (t < S.cfg.start) return 0;
  let i = D.days.indexOf(clampDay(t));
  if (D.days[i] === t && status(t) !== "full") i--;
  let n = 0;
  for (; i >= 0; i--) { const s = status(D.days[i]); if (s === "off" || s === "rest") continue; if (s === "full") n++; else break; }
  return n;
}
function monthLabels(){
  return D.weeks.map((w, i) => { const m = mon(w[0]); const prev = i ? mon(D.weeks[i - 1][0]) : -1; return `<span>${m !== prev ? MON_S[m] : ""}</span>`; }).join("");
}

let dashRange = "30";
try { const r = localStorage.getItem("eng-june-range"); if (["all","30","7"].includes(r)) dashRange = r; } catch (e) {}
let burn = null;
const chartW = () => Math.max(300, Math.min(720, Math.round(($("#p-dash") && $("#p-dash").clientWidth) || 640)));
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p; return 10 * p; }
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function colPath(x, y0, y1, w){ // column growing up from baseline y0 to y1, 4px rounded top, square base
  const hgt = y0 - y1; if (hgt <= 0) return "";
  const r = Math.min(4, w / 2, hgt);
  return `M${x.toFixed(1)},${y0.toFixed(1)}V${(y1 + r).toFixed(1)}Q${x.toFixed(1)},${y1.toFixed(1)} ${(x + r).toFixed(1)},${y1.toFixed(1)}H${(x + w - r).toFixed(1)}Q${(x + w).toFixed(1)},${y1.toFixed(1)} ${(x + w).toFixed(1)},${(y1 + r).toFixed(1)}V${y0.toFixed(1)}Z`;
}
const lineKey = cls => `<svg width="20" height="8" aria-hidden="true"><line class="${cls}" x1="1" x2="19" y1="4" y2="4"/></svg>`;
const boxKey = cls => `<i class="bk ${cls}"></i>`;

/* cumulative hours: plan, fact, forecast */
function burnSVG(){
  const t = todayISO(), n = D.days.length;
  const chPlan = {}, chFact = {};
  D.checks.forEach(c => {
    chPlan[c.win[1]] = (chPlan[c.win[1]] || 0) + checkMin();
    const f = checkFact(c.k);
    if (f) { let d = c.win[0] <= t ? c.win[0] : t; d = clampDay(d); chFact[d] = (chFact[d] || 0) + f; }
  });
  const ti = t < S.cfg.start ? -1 : t > S.cfg.end ? n - 1 : D.days.indexOf(t);
  let cp = 0, cf = 0; const plan = [], fact = [];
  D.days.forEach((d, i) => { cp += planMin(d) + (chPlan[d] || 0); plan.push(cp); if (i <= ti) { cf += factMin(d) + (chFact[d] || 0); fact.push(cf); } });
  const pace = ti >= 0 && plan[ti] > 0 ? cf / plan[ti] : null;
  const fc = pace !== null && ti < n - 1 ? plan.map((v, i) => i < ti ? null : cf + (v - plan[ti]) * pace) : null;
  const W = chartW(), H = 240, L = 34, R = 70, T = 14, B = 24, w = W - L - R, h = H - T - B;
  const maxV = Math.max(plan[n - 1] || 0, fc ? fc[n - 1] : 0, cf, 60);
  const step = niceStep(maxV / 60 / 4) * 60, top = Math.ceil(maxV / step) * step;
  const x = i => L + (n > 1 ? i * w / (n - 1) : 0), y = v => T + h - v / top * h;
  const pts = (arr) => arr.map((v, i) => v === null || v === undefined ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);
  let o = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Накопленные часы: факт, план и прогноз">`;
  for (let v = 0; v <= top + 0.5; v += step) o += `<line class="gl" x1="${L}" x2="${L + w}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${Math.round(v / 60)}</text>`;
  D.days.forEach((d, i) => { if (dnum(d) === 1 || (i === 0 && dnum(d) <= 15)) o += `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : "middle"}">${MON_S[mon(d)]}</text>`; });
  if (ti >= 0 && ti < n - 1) o += `<line class="today" x1="${x(ti).toFixed(1)}" x2="${x(ti).toFixed(1)}" y1="${T}" y2="${T + h}"/>`;
  o += `<polyline class="pl" points="${pts(plan).join(" ")}"/>`;
  if (fc) o += `<polyline class="fc" points="${pts(fc).join(" ")}"/>`;
  if (fact.length > 1) {
    const fp = pts(fact);
    o += `<path class="wash" d="M${x(0).toFixed(1)},${y(0).toFixed(1)}L${fp.join("L")}L${x(fact.length - 1).toFixed(1)},${y(0).toFixed(1)}Z"/>`;
    o += `<polyline class="ln" points="${fp.join(" ")}"/>`;
  }
  // end labels: plan end, forecast end, fact now
  const pe = y(plan[n - 1]);
  o += `<text class="lab mu" x="${L + w + 8}" y="${(pe + 4).toFixed(1)}">план ${hrs(plan[n - 1])}</text>`;
  if (fc) { const fe = y(fc[n - 1]); if (Math.abs(fe - pe) >= 14) o += `<text class="lab" x="${L + w + 8}" y="${(fe + 4).toFixed(1)}">≈ ${hrs(fc[n - 1])}</text>`; }
  if (ti >= 0 && fact.length) { const fx = x(ti), fy = y(cf); o += `<circle class="dot" cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="4"/>`; o += `<text class="lab" x="${(fx - 8).toFixed(1)}" y="${(fy - 10).toFixed(1)}" text-anchor="${fx - L > 60 ? "end" : "start"}">${hrs(cf)} ч</text>`; }
  o += `<line class="xh" id="bx" x1="0" x2="0" y1="${T}" y2="${T + h}" visibility="hidden"/><circle class="dot" id="bd" r="4" visibility="hidden"/>`;
  o += `<rect class="hit" data-burn="1" x="${L}" y="${T}" width="${w}" height="${h}"/>`;
  burn = { plan, fact, fc, ti, n, W, L, w, x, y };
  return o + "</svg>";
}

/* generic columns: plan as a ghost, fact as ink on top of it */
function colsSVG(items, opt){
  opt = opt || {};
  const unit = opt.unit || "min";
  const W = chartW(), H = opt.H || 190, L = unit === "pct" ? 42 : 34, R = 4, T = 18, B = 22, w = W - L - R, h = H - T - B, N = items.length;
  const maxV = Math.max(1, ...items.map(c => Math.max(c.plan || 0, c.fact || 0)));
  let step, top;
  if (unit === "pct") { step = 50; top = Math.max(100, Math.ceil(maxV / 50) * 50); }
  else if (unit === "h") { step = niceStep(maxV / 60 / 3) * 60; top = Math.ceil(maxV / step) * step; }
  else { step = niceStep(maxV / 3); top = Math.ceil(maxV / step) * step; }
  const y = v => T + h - Math.min(v, top) / top * h;
  const band = w / N, bw = Math.max(3, Math.min(24, band - 2));
  const every = Math.max(1, Math.ceil(N / Math.max(1, Math.floor(w / (opt.labelW || 30)))));
  let o = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(opt.aria || "")}">`;
  for (let v = 0; v <= top + 0.01; v += step) {
    const lab = unit === "pct" ? v + "%" : unit === "h" ? Math.round(v / 60) : Math.round(v);
    o += `<line class="gl" x1="${L}" x2="${L + w}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${lab}</text>`;
  }
  items.forEach((c, i) => {
    const cx = L + band * i + band / 2, x0 = cx - bw / 2, base = y(0);
    o += `<g class="col${c.cur ? " cur" : ""}" tabindex="0" data-tip="${esc(c.tip)}">`;
    if (c.plan) o += `<path class="ghost" d="${colPath(x0, base, y(c.plan), bw)}"/>`;
    if (c.fact) o += `<path class="fact" d="${colPath(x0, base, y(c.fact), bw)}"/>`;
    if (opt.capLabels && c.cap !== undefined) o += `<text class="lab" x="${cx.toFixed(1)}" y="${(y(Math.max(c.plan || 0, c.fact || 0)) - 6).toFixed(1)}" text-anchor="middle">${esc(c.cap)}</text>`;
    o += `<rect class="hit" x="${(L + band * i).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${h}"/></g>`;
    if (c.x && (i % every === 0 || c.forceX)) o += `<text class="ax" x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(c.x)}</text>`;
  });
  return o + "</svg>";
}

function rangeDays(){
  const t = todayISO(); if (t < S.cfg.start) return [];
  const e = clampDay(t);
  if (dashRange === "all") return D.days.filter(d => d <= e);

  return D.days.filter(d => d >= from && d <= e);

const SK_SHARE = { testMin:["listening","reading","grammar"], essayMin:["writing"] };
function itemSkills(it){ return it && Array.isArray(it.skills) ? it.skills : []; }

function renderDash(){
  const t = todayISO(), T = totals(), st = streak();

  const forecast = t >= S.cfg.start && T.planToDate && !early ? Math.round(T.fact + (T.planAll - T.planToDate) * pace) : null;

  const gc = goalCalc(), gg = goal();
  $("#p-dash").innerHTML = `

/* tooltip */
const tipEl = document.createElement("div"); tipEl.className = "tip"; tipEl.hidden = true; tipEl.setAttribute("role", "status"); document.body.appendChild(tipEl);
function showTip(lines, x, y){
  tipEl.replaceChildren(...lines.map((l, i) => { const d = document.createElement("div"); d.textContent = l; if (i === 0) d.className = "tip-h"; return d; }));
  tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 14;
  if (left + r.width > window.innerWidth - 8) left = Math.max(8, x - r.width - 14);
  if (top < 8) top = y + 18;
  tipEl.style.left = left + "px"; tipEl.style.top = top + "px";
}
function hideTip(){ tipEl.hidden = true; }
function hideCross(){ const a = document.getElementById("bx"), b = document.getElementById("bd"); if (a) a.setAttribute("visibility", "hidden"); if (b) b.setAttribute("visibility", "hidden"); }
function onDashPointer(e){
  const hb = e.target.closest && e.target.closest("[data-burn]");
  if (hb && burn) {
    const box = hb.ownerSVGElement.getBoundingClientRect(), sc = burn.W / box.width;
    const px = (e.clientX - box.left) * sc;
    let i = Math.round((px - burn.L) / (burn.w / Math.max(1, burn.n - 1))); i = Math.max(0, Math.min(burn.n - 1, i));
    const xx = burn.x(i).toFixed(1);
    const bx = document.getElementById("bx"), bd = document.getElementById("bd");
    bx.setAttribute("x1", xx); bx.setAttribute("x2", xx); bx.setAttribute("visibility", "visible");
    const v = i <= burn.ti ? burn.fact[i] : (burn.fc ? burn.fc[i] : burn.plan[i]);
    bd.setAttribute("cx", xx); bd.setAttribute("cy", burn.y(v).toFixed(1)); bd.setAttribute("visibility", "visible");
    const lines = [fmtDate(D.days[i])];
    if (i <= burn.ti) lines.push(`Факт: ${hrs(burn.fact[i])} ч`);
    lines.push(`План: ${hrs(burn.plan[i])} ч`);
    if (i > burn.ti && burn.fc) lines.push(`Прогноз: ${hrs(burn.fc[i])} ч`);
    showTip(lines, e.clientX, e.clientY); return;
  }
  hideCross();
  const tg = e.target.closest && e.target.closest("[data-tip]");
  if (tg) showTip(tg.dataset.tip.split("\n"), e.clientX, e.clientY); else hideTip();
}

function chartSVG(){
  const pw = ($("#p-tests") && $("#p-tests").clientWidth) || 640;
  const N = D.checks.length;
  const W = Math.max(300, Math.min(720, Math.round(pw))), H = 250, L = 28, R = 28, Tp = 10, B = 26, w = W - L - R, h = H - Tp - B;
  const LO = 20, HI = 90, cl = v => Math.max(LO, Math.min(HI, v));
  const y = v => Tp + (1 - (cl(v) - LO) / (HI - LO)) * h, x = i => L + 14 + (N > 1 ? i * ((w - 28) / (N - 1)) : (w - 28) / 2);
  const g = goal();
  let o = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Результаты тестов по контрольным точкам">`;
  BANDS.forEach(([lo, hi, l], i) => {
    const y1 = y(hi), y2 = y(lo - 1);
    if (i % 2 === 1) o += `<rect class="band" x="${L}" y="${y1.toFixed(1)}" width="${w}" height="${(y2 - y1).toFixed(1)}"/>`;
    o += `<text class="ax" x="${W - R + 6}" y="${((y1 + y2) / 2 + 4).toFixed(1)}">${l}</text>`;
  });
  [30,40,50,60,70].forEach(v => { o += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  const step = Math.ceil(N / Math.max(2, Math.floor(w / 46)));
  D.checks.forEach((c, i) => { if (i % step === 0 || i === N - 1) o += `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${i === 0 ? "старт" : i === N - 1 && N > 1 ? "итог" : MON_S[c.m - 1]}</text>`; });
  if (g.score) o += `<line class="goal" x1="${L}" x2="${W - R}" y1="${y(g.score)}" y2="${y(g.score)}"/><text class="ax" x="${L + 4}" y="${y(g.score) - 6}">цель ${g.score}</text>`;
  const ms = milestones();
  if (ms) { const mp = ms.map((v, i) => v === null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean); if (mp.length > 1) o += `<polyline class="traj" points="${mp.join(" ")}"/>`; }
  const pts = D.checks.map((c, i) => { const v = testState(c.k).efset; return v ? [x(i), y(v), v] : null; }).filter(Boolean);
  if (pts.length > 1) o += `<polyline class="ln" points="${pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}"/>`;
  pts.forEach(p => { o += `<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/><text class="pv" x="${p[0].toFixed(1)}" y="${(p[1] - 10).toFixed(1)}" text-anchor="middle">${p[2]}</text>`; });
  if (!pts.length) o += `<text class="empty" x="${L + w / 2}" y="${Tp + h / 2 + 4}" text-anchor="middle">Здесь появится линия после первого теста</text>`;
  return o + "</svg>";
}
function pathHTML(){

let dlCap;
const getDl = () => { if (dlCap !== undefined) return Promise.resolve(dlCap);

        try { await navigator.share({ files:[file], title:name }); exportMsg = "Файл передан. Его можно открыть в Excel или Numbers."; exportBad = false; }
        catch (e) { if (!(e && e.name === "AbortError")) { exportMsg = "Не удалось передать файл."; exportBad = true; } }
      } else {

const BYDAY = ["SU","MO","TU","WE","TH","FR","SA"];
let calMsg = "", calBad = false, calBusy = false;
const isWeekend = wd => wd === 0 || wd === 6;
/* one plan version -> series of the same item at the same time on several weekdays.
   Items with their own time keep it; the rest follow one another from the weekday / weekend start. */
function slotsFor(items){
  const cal = S.cfg.cal, out = [];
  ORDER.forEach(wd => {
    let cur = toMin(isWeekend(wd) ? cal.we : cal.wk);
    const its = items.filter(it => it.days.includes(wd));
    const fixed = its.filter(it => cal.times[it.id]).map(it => { const a = toMin(cal.times[it.id]); return [a, a + it.min]; });
    its.forEach(it => {
      const own = cal.times[it.id];
      let st;
      if (own) st = toMin(own);
      else { // next free slot that does not overlap an activity with its own time
        for (let moved = true, guard = 0; moved && guard < 20; guard++) { moved = false; for (const [a, b] of fixed) if (cur < b && cur + it.min > a) { cur = b; moved = true; } }
        st = cur; cur += it.min;
      }
      st = Math.max(0, Math.min(st, 1439 - Math.min(it.min, 1439)));
      let g = out.find(o => o.it.id === it.id && o.start === st);
      if (!g) out.push(g = { it, start:st, days:[] });
      g.days.push(wd);
    });
  });
  return out;
}
const calFrom = () => { const t = todayISO(); return t < S.cfg.start ? S.cfg.start : t; };
function calSeries(){
  const from = calFrom(), end = S.cfg.end, out = [];
  if (from > end) return out;
  S.plans.forEach((p, i) => {
    const vs = p.from > from ? p.from : from, nx = S.plans[i + 1] ? add(S.plans[i + 1].from, -1) : end, ve = nx < end ? nx : end;
    if (vs > ve) return;
    slotsFor(p.items).forEach(s => {
      let first = null; for (let d = vs, k = 0; d <= ve && k < 7; d = add(d, 1), k++) if (s.days.includes(dow(d))) { first = d; break; }
      if (!first) return;
      let last = ve; while (!s.days.includes(dow(last))) last = add(last, -1);
      const ex = Object.keys(S.days).filter(d => d >= first && d <= ve && S.days[d].off && s.days.includes(dow(d))).sort();
      out.push({ ...s, first, last, until:ve, ex, from:p.from });
    });
  });
  return out;
}
function calTests(){
  const from = calFrom();
  return D.checks.filter(c => c.win[1] >= from).map(c => ({ c, title: c.label === "Старт" ? "Стартовый тест и эссе" : c.label === "Итог" ? "Итоговый тест и эссе" : "Контрольный тест и эссе" }));

const goalTitle = () => { const g = goal(); return "Срок цели" + (g.lvl ? `: ${g.lvl}` : "") + (g.score ? ` (${g.score}+ баллов)` : ""); };
const daysText = days => ORDER.filter(d => days.includes(d)).map(d => WD2[d]).join(", ");
const icsDT = (iso, m) => iso.replace(/-/g, "") + "T" + pad(Math.floor(m / 60)) + pad(m % 60) + "00";
const icsD = iso => iso.replace(/-/g, "");
const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
function icsFold(line){
  const enc = new TextEncoder(); if (enc.encode(line).length <= 75) return line;
  const out = []; let cur = "", n = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (n + b > 75) { out.push(cur); cur = " " + ch; n = 1 + b; } else { cur += ch; n += b; } }
  out.push(cur); return out.join("\r\n");
}
function itemDesc(it){
  const sk = SKILLS.filter(s => itemSkills(it).includes(s[0])).map(s => s[1]).join(", ");

function buildICS(){

  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//English plan//RU", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:" + icsEsc("Английский")];

      "DTSTART:" + icsDT(s.first, s.start), "DTEND:" + icsDT(s.first, end),
      `RRULE:FREQ=WEEKLY;BYDAY=${ORDER.filter(d => s.days.includes(d)).map(d => BYDAY[d]).join(",")};UNTIL=${icsD(s.until)}T235959`);

      "SUMMARY:" + icsEsc(title), "DESCRIPTION:" + icsEsc("Тест уровня и эссе. Результат запишите в трекере."), "TRANSP:TRANSPARENT", "END:VEVENT");

          <input class="plain" type="time" data-ct="${esc(it.id)}" value="${esc(c.times[it.id] || "")}" aria-label="Время начала: ${esc(it.name)}">
        </div>`).join("")}</div>
      <p class="sub" style="margin:12px 0 0">Если время не задано, занятия идут одно за другим.</p>
      <div class="inline" style="margin-top:10px"><span class="muted">По будням с</span><input class="plain" type="time" id="cal-wk" value="${c.wk}"><span class="muted">по выходным с</span><input class="plain" type="time" id="cal-we" value="${c.we}"></div>
      <label class="cbx" for="cal-alarm" style="margin-top:18px"><input type="checkbox" id="cal-alarm" ${c.alarm ? "checked" : ""}> Напоминание за 15 минут</label>
      <div style="margin-top:20px"><button type="button" class="btn" data-ics="1" ${over ? "disabled" : ""}>Скачать файл для календаря</button></div>
      ${calMsg ? `<p class="msg${calBad ? " bad" : ""}" role="status">${esc(calMsg)}</p>` : ""}
      <div class="howto">
        <p><b>Apple Календарь.</b> Откройте файл .ics и нажмите «Добавить все». На iPhone и iPad: в меню «Поделиться» выберите «Сохранить в Файлы», затем откройте файл в «Файлах».</p>
        <p><b>Google Календарь.</b> На calendar.google.com: Настройки → Импорт и экспорт → выберите файл .ics и календарь.</p>
        <p>Добавляйте в отдельный календарь, например «Английский»: при изменении плана его легко очистить и загрузить заново.</p>
        ${BUILD === "artifact" ? `<p>В этом предпросмотре файл сохраняется в архиве .zip — распакуйте его. В установленной версии приложения сохраняется сразу файл .ics.</p>` : ""}
      </div>
      ${links.length ? `<details class="tblv" id="cal-g"><summary>Добавить в Google Календарь по одному событию</summary>
        <div class="rows">${links.map(l => `<div class="r"><span><span class="g-l">${esc(l.label)}</span><small>${esc(l.meta)}</small></span><a href="${esc(l.url)}" target="_blank" rel="noopener">Добавить</a></div>`).join("")}</div></details>` : ""}
      ${over ? `<p class="sub" style="margin:12px 0 0">Срок цели уже прошёл — добавлять в календарь нечего.</p>` : ""}
    </section>`;
}
function refreshCal(){
  document.querySelectorAll("[data-cth]").forEach(el => { const it = calItems().find(x => x.id === el.dataset.cth); if (it) el.textContent = calWhen(it); });
  const g = $("#cal-g"); if (g) { const open = g.open; const tmp = document.createElement("div"); tmp.innerHTML = calHTML(); const ng = tmp.querySelector("#cal-g"); if (ng) { ng.open = open; g.replaceWith(ng); } }
}
async function exportICS(){
  if (calBusy) return; calBusy = true;
  try {
    const ics = buildICS(); if (!ics) throw 0;
    if (BUILD === "artifact") {
      const dl = await getDl();
      if (!dl) { calMsg = "В этом окне сохранять файлы нельзя."; calBad = true; }
      else {
        const zipBytes = XL.zip([{ name:"english-schedule.ics", text:ics }]);
        try { await dl.save({ filename:"english-schedule.zip", data:new Blob([zipBytes]) }); calMsg = "Архив сохранён. Внутри — файл english-schedule.ics."; calBad = false; }
        catch (e) { const c = e && e.code; calMsg = c === "declined" ? "" : c === "rate_limited" ? "Окно сохранения уже открыто." : "Не удалось сохранить файл."; calBad = c !== "declined"; }
      }
    } else {
      const blob = new Blob([ics], { type:"text/calendar" }), name = "english-schedule.ics";
      let file = null; try { file = new File([blob], name, { type:"text/calendar" }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
        try { await navigator.share({ files:[file], title:name }); calMsg = "Файл передан."; calBad = false; }
        catch (e) { if (!(e && e.name === "AbortError")) { calMsg = "Не удалось передать файл."; calBad = true; } }
      } else {
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        calMsg = "Файл скачан."; calBad = false;
      }
    }
  } catch (e) { calMsg = "Не удалось собрать файл."; calBad = true; }
  calBusy = false;
  const sec = $("#cal"); if (sec) { const g = $("#cal-g"), open = g && g.open; sec.outerHTML = calHTML(); const ng = $("#cal-g"); if (ng && open) ng.open = true; }
}

/* ---------- render ---------- */
function renderAll(){
  renderHeader();
  if (tab === "today") renderToday();
  else if (tab === "dash") renderDash();
  else if (tab === "tests") renderTests(false);
  else renderPlan();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  const ds = b.dataset;
  if (ds.tab) {
    setTab(ds.tab); exportMsg = ""; goalMsg = ""; calMsg = ""; if (ds.open) { openChecks.clear(); openChecks.add(ds.open); }
    renderHeader(); if (tab === "tests") renderTests(true); else renderAll();
    const tg = ds.scroll && document.getElementById(ds.scroll); if (tg) tg.scrollIntoView({block:"start"}); else window.scrollTo({top:0});
    return;
  }
  if (ds.toggle !== undefined && ds.toggle !== "") { const id = ds.toggle; editDay(sel, r => { r.done = r.done.includes(id) ? r.done.filter(x => x !== id) : r.done.concat(id); }); saveAll(); renderAll(); return; }
  if (ds.tflag) { editTest(ds.k, ds.tflag, !testState(ds.k)[ds.tflag]); saveAll(); renderAll(); return; }
  if (ds.nav) { sel = clampDay(add(sel, Number(ds.nav))); renderAll(); return; }
  if (b.hasAttribute("data-go-today")) { sel = clampDay(todayISO()); renderAll(); return; }
  if (ds.day) { sel = ds.day; setTab("today"); renderAll(); window.scrollTo({top:0}); return; }
  // plan editor
  if (ds.wd !== undefined) { const it = draftItem(b); if (!it) return; const d = Number(ds.wd); it.days = it.days.includes(d) ? it.days.filter(x => x !== d) : it.days.concat(d); b.setAttribute("aria-pressed", String(it.days.includes(d))); const wm = b.closest(".ed").querySelector("[data-wm]"); if (wm) wm.textContent = `${it.min * it.days.length} мин в неделю`; planTouched(); return; }
  if (ds.step) { const it = draftItem(b); if (!it) return; it.min = clampInt(it.min + Number(ds.step), 5, 600, 30); const ed = b.closest(".ed"); ed.querySelector('[data-f="min"]').value = it.min; ed.querySelector("[data-wm]").textContent = `${it.min * it.days.length} мин в неделю`; planTouched(); return; }
  if (ds.sk) { const it = draftItem(b); if (!it) return; const k = ds.sk; it.skills = (it.skills || []).includes(k) ? it.skills.filter(x => x !== k) : (it.skills || []).concat(k); b.setAttribute("aria-pressed", String(it.skills.includes(k))); planTouched(); return; }
  if (ds.shift) { setDeadline(addMonths(S.cfg.end, Number(ds.shift))); renderHeader(); renderTests(true); return; }
  if (ds.range) { dashRange = ds.range; try { localStorage.setItem("eng-june-range", dashRange); } catch (e) {} hideTip(); renderDash(); return; }
  if (b.id === "pl-add") { const it = { id:newId(), name:"Новое занятие", min:30, res:"", days:[], skills:[] }; draft.items.push(it); planTouched(); renderPlan(); const inp = document.getElementById(`ed-${it.id}-name`); if (inp) { inp.focus(); inp.select(); } return; }
  if (ds.del) { if (delArm === ds.del) { draft.items = draft.items.filter(it => it.id !== ds.del); delArm = null; planTouched(); } else arm("del", ds.del); renderPlan(); return; }
  if (ds.delver) { if (verArm === ds.delver) { S.plans = S.plans.filter(p => p.from !== ds.delver); verArm = null; saveAll(); if (!draft.dirty) resetDraft(); planMsg = "Версия плана удалена."; planBad = false; } else arm("ver", ds.delver); renderAll(); return; }
  if (b.id === "pl-save") { savePlan(); return; }
  if (b.id === "pl-cancel") { resetDraft(); planMsg = ""; renderPlan(); return; }
  // backup
  if (ds.export) { exportExcel(); return; }
  if (ds.ics) { exportICS(); return; }
  if (b.id === "bk-save") { saveBackup(); return; }
  if (b.id === "bk-load") { const f = $("#bk-file"); if (f) { f.value = ""; f.click(); } return; }
  if (b.id === "bk-yes" && pendingImport) { S = pendingImport.st; pendingImport = null; derive(); sel = clampDay(todayISO()); saveAll(); resetDraft(); backupMsg = "Данные восстановлены."; backupBad = false; renderAll(); return; }
  if (b.id === "bk-no") { pendingImport = null; renderAll(); return; }
});
$("#t-note").addEventListener("input", e => { const v = e.target.value.slice(0, 4000), d = sel; editDay(d, r => { r.note = v; }); saveSoon(); });
$("#t-note").addEventListener("blur", () => { if (saveTimer) saveAll(); });
$("#t-off").addEventListener("change", e => { editDay(sel, r => { r.off = e.target.checked; }); saveAll(); renderAll(); });

const pt = $("#p-tests");
pt.addEventListener("toggle", e => { const d = e.target; if (d.matches && d.matches("details.ck")) d.open ? openChecks.add(d.dataset.k) : openChecks.delete(d.dataset.k); }, true);
function onTest(e){
  const el = e.target;
  if (el.id === "g-level") { // a level stands for its lowest score, unless the current score is already inside it
    const l = LEVELS.includes(el.value) ? el.value : "";
    S.cfg.goalLevel = l; S.cfg.goalScore = !l ? null : levelOf(S.cfg.goalScore) === l ? S.cfg.goalScore : GOAL_MIN[l];
    const gs = $("#g-score"); if (gs) gs.value = S.cfg.goalScore || "";
    saveAll(); refreshTests(); return;
  }
  if (el.id === "g-score") { // a score sets its level
    const v = parseInt(el.value, 10);
    if (v >= 1 && v <= 100) { S.cfg.goalScore = v; S.cfg.goalLevel = levelOf(v); } else if (el.value === "") { S.cfg.goalScore = null; S.cfg.goalLevel = ""; }
    saveSoon(); refreshTests(); return;
  }
  const k = el.dataset.k, f = el.dataset.f; if (!k || !f) return;
  let v;
  if (el.type === "checkbox") v = el.checked;
  else if (f === "efset") { const n = parseInt(el.value, 10); v = n >= 1 && n <= 100 ? n : null; }
  else v = el.value.slice(0, 2000);
  editTest(k, f, v);
  if (f === "efset") {
    const id = "c" + k.replace("-", "");
    if (v && !testState(k).testDone) { editTest(k, "testDone", true); const cb = document.getElementById(id + "-t"); if (cb) cb.checked = true; }
    const op = document.querySelector(`#${id}-cf option[value=""]`); if (op) op.textContent = v ? `${levelOf(v)} — по баллу` : "—";
  }
  if (el.type === "checkbox" || el.tagName === "SELECT") saveAll(); else saveSoon();
  refreshTests();
}
pt.addEventListener("input", e => { if (e.target.id !== "g-end" && e.target.type !== "checkbox" && e.target.tagName !== "SELECT") onTest(e); });
pt.addEventListener("change", e => {
  if (e.target.id === "g-end") { if (e.target.value && e.target.value !== S.cfg.end) { setDeadline(e.target.value); renderHeader(); renderTests(true); } return; }
  if (e.target.type === "checkbox" || e.target.tagName === "SELECT") onTest(e);
});
pt.addEventListener("change", e => { if (e.target.id === "g-score") { const gs = e.target, g = goal(); gs.value = g.score || ""; } });
pt.addEventListener("focusout", () => setTimeout(() => { if (saveTimer) saveAll(); if (testsDirty && !pt.contains(document.activeElement)) renderTests(true); }, 0));

const pp = $("#p-plan");
pp.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "pl-eff") { draft.eff = el.value; return; }
  if (el.id === "cf-start") { draft.start = el.value; planTouched(); return; }
  if (el.id === "cf-end") { draft.end = el.value; planTouched(); return; }
  if (el.id === "cf-from") { draft.tests.from = clampInt(el.value, 1, 28, draft.tests.from); planTouched(); return; }
  if (el.id === "cf-to") { draft.tests.to = clampInt(el.value, 1, 28, draft.tests.to); planTouched(); return; }
  if (el.id === "cf-tmin") { draft.tests.testMin = clampInt(el.value, 0, 600, draft.tests.testMin); planTouched(); return; }
  if (el.id === "cf-emin") { draft.tests.essayMin = clampInt(el.value, 0, 600, draft.tests.essayMin); planTouched(); return; }
  if (el.closest("#cal")) return;
  const it = draftItem(el); if (!it || !el.dataset.f) return;
  if (el.dataset.f === "name") it.name = el.value;
  else if (el.dataset.f === "res") it.res = el.value;
  else if (el.dataset.f === "min") { const n = parseInt(el.value, 10); if (n >= 1) { it.min = Math.min(600, n); const wm = el.closest(".ed").querySelector("[data-wm]"); if (wm) wm.textContent = `${it.min * it.days.length} мин в неделю`; } }
  planTouched();
});
pp.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "cf-on") { draft.tests.on = el.checked; const m = $("#cf-more"); if (m) m.hidden = !el.checked; planTouched(); return; }
  if (el.id === "bk-file" && el.files && el.files[0]) { readBackup(el.files[0]); return; }
  if (el.dataset.ct !== undefined) { const id = el.dataset.ct; if (isHM(el.value)) S.cfg.cal.times[id] = el.value; else delete S.cfg.cal.times[id]; saveAll(); refreshCal(); return; }
  if (el.id === "cal-wk" || el.id === "cal-we") { if (isHM(el.value)) { S.cfg.cal[el.id === "cal-wk" ? "wk" : "we"] = el.value; saveAll(); refreshCal(); } else el.value = S.cfg.cal[el.id === "cal-wk" ? "wk" : "we"]; return; }
  if (el.id === "cal-alarm") { S.cfg.cal.alarm = el.checked; saveAll(); return; }
  if (el.dataset.f === "min") { const it = draftItem(el); if (it) { it.min = clampInt(it.min, 5, 600, 30); el.value = it.min; } }
});

/* a new day while the app stays open */
let lastToday = todayISO();
function dayCheck(){ const t = todayISO(); if (t !== lastToday) { if (sel === clampDay(lastToday)) sel = clampDay(t); lastToday = t; renderAll(); } }
setInterval(dayCheck, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") dayCheck(); });
let rz = null;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { hideTip(); if (tab === "tests") { const c = $("#g-chart"); if (c) c.innerHTML = chartSVG(); } if (tab === "dash") renderDash(); }, 150); });
const pdash = $("#p-dash");
pdash.addEventListener("pointermove", onDashPointer);
pdash.addEventListener("pointerdown", onDashPointer);
pdash.addEventListener("pointerleave", () => { hideTip(); hideCross(); });
pdash.addEventListener("focusin", e => { const tg = e.target.closest("[data-tip]"); if (tg) { const r = tg.getBoundingClientRect(); showTip(tg.dataset.tip.split("\n"), r.left + r.width / 2, r.top); } });
pdash.addEventListener("focusout", hideTip);
window.addEventListener("scroll", () => { if (!tipEl.hidden) { hideTip(); hideCross(); } }, { passive:true });

load(); derive(); sel = clampDay(todayISO()); renderAll();
if (BUILD === "pwa") {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("./sw.js").catch(() => {});
}
})();
</script>
</body>
</html>
