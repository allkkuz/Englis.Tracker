/* Layout: one phone-first column (max 760px): header, sticky tab bar, then the active screen. Surfaces only where something is tapped. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E1E6EE; --ink:#172036; --muted:#5D6780; --line:#D2D9E5;
  --accent:#2E55D9; --on-accent:#FFFFFF; --mark:#F2CF45;
  --good:#23915F; --part:#86C9A6; --miss:#E7AFA5; --bad:#C8483A;
  --c-tutor:#D2513F; --c-hw:#C47F1A; --c-words:#23915F; --c-grammar:#7656D1; --c-podcast:#2F7FD0; --c-reading:#13918F;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1220; --surface:#151C2D; --sunk:#1F283D; --ink:#E5EAF4; --muted:#9AA4BC; --line:#2A3450;
    --accent:#86A2FF; --on-accent:#0D1220; --mark:#E2C23A;
    --good:#45BE86; --part:#2E7457; --miss:#7A3B36; --bad:#EE7461;
    --c-tutor:#EE7461; --c-hw:#E7A94B; --c-words:#45BE86; --c-grammar:#A88CF2; --c-podcast:#62A9EE; --c-reading:#3CC2C2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2D; --sunk:#1F283D; --ink:#E5EAF4; --muted:#9AA4BC; --line:#2A3450;
  --accent:#86A2FF; --on-accent:#0D1220; --mark:#E2C23A;
  --good:#45BE86; --part:#2E7457; --miss:#7A3B36; --bad:#EE7461;
  --c-tutor:#EE7461; --c-hw:#E7A94B; --c-words:#45BE86; --c-grammar:#A88CF2; --c-podcast:#62A9EE; --c-reading:#3CC2C2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:grid;gap:22px}
h2{font:500 16px/1.3 var(--f-display);margin:0;letter-spacing:.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}

/* header */
.top{display:grid;gap:6px}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font:700 clamp(25px,6.4vw,36px)/1.08 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted)}
.save{display:inline-flex;align-items:center;gap:6px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.save[data-s="saved"]::before,.save[data-s="sync"]::before{background:var(--good)}
.save[data-s="saving"]::before{background:var(--mark)}
.save[data-s="err"]::before,.save[data-s="quota"]::before,.save[data-s="ro"]::before{background:var(--bad)}
.goalchip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:12.5px}
.goalchip b{font-family:var(--f-mono);font-weight:600}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:4px;padding-block:10px;margin-block:14px 10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-width:0;font-weight:600;font-size:14px;padding:9px 4px;border-radius:10px;border:0;background:transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* today */
.daynav{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center}
.daynav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.daynav button:disabled{opacity:.35;cursor:default}
.dn-date{font:500 19px/1.25 var(--f-display);text-align:center;text-wrap:balance}
.dn-sub{font-size:13px;color:var(--muted);text-align:center;margin-top:2px}
.dn-sub button{border:0;background:none;color:var(--accent);padding:0;font-weight:600;font-size:13px}
.banner{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.banner button{margin-top:8px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dayhead{display:flex;gap:14px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.ring{flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--sunk)}
.ring .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .35s ease}
.ring text{font:600 13px var(--f-mono);fill:var(--ink)}
.dh-main{display:grid;gap:4px;min-width:0}
.dh-min{font:600 20px/1.2 var(--f-mono)}
.dh-min span{font-size:14px;color:var(--muted);font-weight:500}
.pill{justify-self:start;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.pill[data-st="full"]{background:var(--good);color:var(--surface)}
.pill[data-st="part"]{background:var(--part);color:var(--ink)}
.pill[data-st="miss"]{background:var(--miss);color:var(--ink)}
.pill[data-st="today"]{background:var(--mark);color:#1b1b1b}
.acts{list-style:none;margin:0;padding:0}
.acts li+li{border-top:1px solid var(--line)}
.act{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:13px 16px;min-height:58px;background:none;border:0;text-align:left}

<script>
(() => {
"use strict";

/* ---------- plan from the "Стратегия копия" sheet ---------- */
const ACT = [
  {k:"tutor",   n:"Репетитор",     m:60, res:"Miro · Teams"},
  {k:"hw",      n:"ДЗ к встрече",  m:40, res:"Miro · грамматика из учебника"},
  {k:"words",   n:"Новые слова",   m:30, res:"Reword"},
  {k:"grammar", n:"Грамматика",    m:30, res:"English Galaxy"},
  {k:"podcast", n:"Подкаст",       m:45, res:"BBC Learning English · British Council · RealLife"},
  {k:"reading", n:"Чтение",        m:30, res:"Oxford Bookworms, позже финансовые статьи"}
];
const A = Object.fromEntries(ACT.map(a => [a.k, a]));
const PLAN = { // 0 = воскресенье
  1:["words","grammar","reading"],
  2:["hw","words","grammar","reading"],
  3:["tutor","words","grammar","reading"],
  4:["words","grammar","reading"],
  5:["words","grammar","reading"],
  6:["tutor","hw","words","podcast"],
  0:["words","podcast"]
};
const CHECK_MIN = 120; // тест 60 + эссе 60
const START = "2026-10-19", END = "2027-06-06";
const LINKS = {
  efset:"https://www.efset.org/ru/", tracktest:"https://app.tracktest.eu/login", dialang:"https://dialang.net/content/als.html",
  bbc:"https://www.bbc.co.uk/learningenglish/english/", bc:"https://learnenglish.britishcouncil.org/", rl:"https://app.servers.reallifeglobal.com/"
};
const MON_G = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MON_S = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MON_N = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const WD = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const WDS = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const BANDS = [[1,30,"A1"],[31,40,"A2"],[41,50,"B1"],[51,60,"B2"],[61,70,"C1"],[71,100,"C2"]];
const GOAL_MIN = {A1:1,A2:31,B1:41,B2:51,C1:61,C2:71};

/* ---------- dates ---------- */
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); };
const isoOf = d => d.toISOString().slice(0,10);
const add = (s, n) => { const d = toD(s); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
const dow = s => toD(s).getUTCDay();
const mon = s => Number(s.slice(5,7)) - 1;
const dnum = s => Number(s.slice(8,10));
function todayISO(){ const n = new Date(); return n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,"0") + "-" + String(n.getDate()).padStart(2,"0"); }
const clampDay = s => s < START ? START : (s > END ? END : s);
const DAYS = []; for (let s = START; s <= END; s = add(s,1)) DAYS.push(s);
const WEEKS = []; for (let i = 0; i < DAYS.length; i += 7) WEEKS.push(DAYS.slice(i, i+7));
const weekOf = s => Math.floor(DAYS.indexOf(s) / 7);
const CHECKS = (() => {
  const out = []; let y = 2026, m = 10;
  for (let i = 0; i < 9; i++) {
    const k = y + "-" + String(m).padStart(2,"0");
    out.push({ k, y, m, label: i === 0 ? "Старт" : i === 8 ? "Финиш" : MON_N[m-1],
      win: i === 0 ? ["2026-10-19","2026-10-25"] : [k + "-01", k + "-05"] });
    m++; if (m > 12) { m = 1; y++; }
  }
  return out;
})();
const checkFor = s => CHECKS.find(c => s >= c.win[0] && s <= c.win[1]);
function rangeLabel(a, b){
  return mon(a) === mon(b) ? `${dnum(a)}–${dnum(b)} ${MON_S[mon(b)]}` : `${dnum(a)} ${MON_S[mon(a)]} – ${dnum(b)} ${MON_S[mon(b)]}`;
}
function plural(n, f){ const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; }
const hrs = min => String(Math.round(min / 6) / 10).replace(".", ",");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const $ = sel => document.querySelector(sel);
const levelOf = sc => { const v = Number(sc); if (!v) return ""; for (const [lo,hi,l] of BANDS) if (v >= lo && v <= hi) return l; return v > 100 ? "C2" : ""; };

/* ---------- state ---------- */
const S = { days:{}, tests:{}, settings:{}, mode:"loading", ro:false };
let sel = clampDay(todayISO());
let tab = "today";
try { const t = localStorage.getItem("eng-june-tab"); if (["today","progress","tests","plan"].includes(t)) tab = t; } catch (e) {}

function dayState(s){
  const r = S.days[s] || {};
  return { done: Array.isArray(r.done) ? r.done.filter(k => A[k]) : [], off: !!r.off, note: typeof r.note === "string" ? r.note : "" };
}
const planOf = s => dayState(s).off ? [] : PLAN[dow(s)];
const planMin = s => planOf(s).reduce((t,k) => t + A[k].m, 0);
const factMin = s => dayState(s).done.reduce((t,k) => t + A[k].m, 0);
function status(s){
  const st = dayState(s), t = todayISO();
  if (st.off) return "off";
  const p = planMin(s), f = factMin(s);
  if (f >= p && p > 0) return "full";
  if (f > 0) return "part";
  if (s < t) return "miss";
  return s === t ? "today" : "future";
}
const testState = k => { const r = S.tests[k] || {}; return {
  testDone: !!r.testDone, essayDone: !!r.essayDone,

/* ---------- storage: on this iPad (localStorage) + backup file ---------- */
const timers = {};
const LS_KEY = "eng-june-v1", LS_BACKUP = "eng-june-last-backup";
S.mode = "local";
function load(){
  try { const r = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (r && typeof r === "object") { S.days = r.days || {}; S.tests = r.tests || {}; S.settings = r.settings || {}; } }
  catch (e) { setSave("err"); }
}
const SAVE_TEXT = { saved:"Сохранено на этом iPad", err:"Не удалось сохранить: память браузера недоступна" };
function setSave(s){ const el = $("#save"); el.dataset.s = s; el.textContent = SAVE_TEXT[s] || ""; }
function saveAll(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({days:S.days, tests:S.tests, settings:S.settings})); setSave("saved"); }
  catch (e) { setSave("err"); }
}
function persist(p){ clearTimeout(timers[p]); delete timers[p]; saveAll(); }
function persistSoon(p, ms){ clearTimeout(timers[p]); timers[p] = setTimeout(() => persist(p), ms || 500); }
window.addEventListener("pagehide", () => { if (Object.keys(timers).length) { Object.keys(timers).forEach(p => clearTimeout(timers[p])); saveAll(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && Object.keys(timers).length) saveAll(); });

function lastBackup(){ try { return localStorage.getItem(LS_BACKUP) || ""; } catch (e) { return ""; } }
function markBackup(){ try { localStorage.setItem(LS_BACKUP, new Date().toISOString()); } catch (e) {} }
function backupDue(){
  const marked = Object.values(S.days).filter(d => d && Array.isArray(d.done) && d.done.length).length;
  if (marked < 5) return false;
  const lb = lastBackup(); if (!lb) return true;
  return (Date.now() - Date.parse(lb)) > 14 * 864e5;
}
function exportJSON(){ return JSON.stringify({ app:"eng-june", v:1, exportedAt:new Date().toISOString(), days:S.days, tests:S.tests, settings:S.settings }); }
let backupMsg = "", backupBad = false, pendingImport = null;
async function saveBackup(){
  const name = `english-backup-${todayISO()}.json`;
  const blob = new Blob([exportJSON()], {type:"application/json"});
  let file = null; try { file = new File([blob], name, {type:"application/json"}); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:name}); markBackup(); backupMsg = "Копия сохранена. Храните файл в iCloud Drive."; backupBad = false; renderAll(); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  markBackup(); backupMsg = "Файл копии скачан. Проверьте папку «Загрузки» в приложении «Файлы»."; backupBad = false; renderAll();
}
function readImport(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const r = JSON.parse(String(fr.result));
      if (!r || r.app !== "eng-june" || typeof r.days !== "object") throw new Error("format");
      pendingImport = { days: r.days || {}, tests: r.tests || {}, settings: r.settings || {}, at: r.exportedAt || "" };
      backupMsg = ""; backupBad = false;
    } catch (e) { pendingImport = null; backupMsg = "Это не файл копии трекера. Выберите файл english-backup-….json."; backupBad = true; }
    renderAll();
  };
  fr.onerror = () => { backupMsg = "Не удалось прочитать файл."; backupBad = true; renderAll(); };
  fr.readAsText(file);
}
function applyImport(){
  if (!pendingImport) return;
  S.days = pendingImport.days; S.tests = pendingImport.tests; S.settings = pendingImport.settings;
  pendingImport = null; saveAll(); backupMsg = "Данные восстановлены из копии."; backupBad = false; renderAll();
}

/* ---------- render: progress ---------- */
function totals(){
  const t = todayISO();
  let planAll = 0, planToDate = 0, fact = 0;
  DAYS.forEach(d => { const p = planMin(d); planAll += p; if (d <= t) planToDate += p; fact += factMin(d); });
  CHECKS.forEach(c => { planAll += CHECK_MIN; if (c.win[1] < t) planToDate += CHECK_MIN; const ts = testState(c.k); fact += (ts.testDone ? 60 : 0) + (ts.essayDone ? 60 : 0); });
  return { planAll, planToDate, fact };
}
function streak(){
  const t = todayISO(); if (t < START) return 0;
  let i = DAYS.indexOf(clampDay(t)); if (i < 0) i = DAYS.length - 1;
  if (DAYS[i] === t && status(t) !== "full") i--;
  let n = 0;
  for (; i >= 0; i--) { const s = status(DAYS[i]); if (s === "off") continue; if (s === "full") n++; else break; }
  return n;
}
function renderProgress(){
  const t = todayISO(), T = totals();
  const pct = T.planAll ? T.fact / T.planAll : 0, pace = T.planAll ? T.planToDate / T.planAll : 0;
  const fullDays = DAYS.filter(d => d <= t && status(d) === "full").length;
  const pastDays = DAYS.filter(d => d <= t && status(d) !== "off").length;
  const cw = t < START ? 0 : t > END ? WEEKS.length - 1 : weekOf(t);
  const wp = WEEKS[cw].reduce((a,d) => a + planMin(d), 0), wf = WEEKS[cw].reduce((a,d) => a + factMin(d), 0);
  let sumtext;
  if (t < START) sumtext = `Старт 19 октября. План — ${hrs(T.planAll)} ч: ежедневные занятия и 9 контрольных тестов с эссе.`;
  else { const r = T.planToDate ? Math.round(T.fact / T.planToDate * 100) : 0; sumtext = `По графику к сегодняшнему дню — ${hrs(T.planToDate)} ч. Вы выполнили ${r}% от этого.`; }

  const months = [];
  WEEKS.forEach((wk, i) => { const m = mon(wk[0]); if (i === 0 || m !== mon(WEEKS[i-1][0])) months.push([i, MON_S[m]]); });
  const monthCells = Array.from({length:33}, (_, i) => { const hit = months.find(x => x[0] === i); return `<span>${hit ? hit[1] : ""}</span>`; }).join("");

  const actRows = ACT.map(a => {

    DAYS.forEach(d => { if (d > t) return; if (planOf(d).includes(a.k)) planned++; if (dayState(d).done.includes(a.k)) done++; });
    const r = planned ? Math.min(done / planned, 1) : 0;
    return `<div class="as-row" style="--c:var(--c-${a.k})"><span class="nm">${a.n}</span><span class="v">${done} из ${planned}</span><div class="as-bar"><i style="width:${(r * 100).toFixed(1)}%"></i></div></div>`;
  }).join("");

  const monthRows = CHECKS.map(c => {

    const p = ds.reduce((a,d) => a + planMin(d), 0) + CHECK_MIN, ts = testState(c.k);

      <div class="bar-legend"><span>Сделано ${Math.round(pct * 100)}% всего плана</span><span>▍— по графику на сегодня</span></div>
      <p class="sumtext">${sumtext}</p>
    </section>
    <div class="stats">

      <div class="stat"><b>${fullDays}<span class="muted" style="font-size:14px"> / ${pastDays}</span></b><span>полных дней</span></div>

        ${WEEKS.map((wk, i) => {

        }).join("")}

    <section class="stack" style="gap:12px">

        <tbody>${monthRows}</tbody></table></div>
    </section>`;
}

  if (pts.length > 1) out += `<polyline class="ln" points="${pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}"/>`;
  pts.forEach(p => { out += `<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5"/><text class="pv" x="${p[0].toFixed(1)}" y="${(p[1] - 10).toFixed(1)}" text-anchor="middle">${p[2]}</text>`; });
  if (!pts.length) out += `<text class="empty" x="${L + w / 2}" y="${Tp + h / 2 + 4}" text-anchor="middle">Внесите балл стартового теста — здесь появится линия роста</text>`;
  return out + "</svg>";
}
function goalPath(){
  const g = goal(), first = CHECKS.map(c => ({c, ts:testState(c.k)})).find(o => checkLevel(o.ts) || o.ts.efset), cur = currentLevel();
  const box = (label, lvl, sc, cls) => `<div class="lv${cls ? " " + cls : ""}"><small>${label}</small><b>${esc(lvl || "—")}${sc ? " · " + sc : ""}</b></div>`;
  return box("Старт", first ? checkLevel(first.ts) : "", first ? first.ts.efset : null) + `<span class="arr">→</span>` +
         box("Сейчас", cur ? cur.lvl : "", cur ? cur.score : null) + `<span class="arr">→</span>` +
         box("Цель", g.lvl, g.score ? g.score + "+" : null, "goal");
}
function scaleHTML(){
  const cur = currentLevel();
  return `<div class="scale">${BANDS.map(b => `<span class="${cur && cur.lvl === b[2] ? "hit" : ""}">${b[2]}</span>`).join("")}</div>
    <div class="scale-n">${BANDS.map(b => `<span>${b[0]}–${b[1]}</span>`).join("")}</div>`;
}
function checkSummary(c){
  const ts = testState(c.k), lvl = checkLevel(ts);
  const flags = `${ts.testDone ? "тест ✓" : "тест —"} · ${ts.essayDone ? "эссе ✓" : "эссе —"}`;
  return `<span class="chk-name">${c.label}</span><span class="chk-res">${lvl ? esc(lvl) : "—"}${ts.efset ? " · " + ts.efset : ""}<small>${flags}</small></span><span class="chk-win">${rangeLabel(c.win[0], c.win[1])}</span>`;
}
function renderTests(force){
  const panel = $("#p-tests");
  if (!force && panel.contains(document.activeElement) && document.activeElement.matches("input,select,textarea")) { testsDirty = true; refreshTestsLight(); return; }
  testsDirty = false;
  const g = goal(), t = todayISO(), dis = S.ro ? "disabled" : "";
  const now = CHECKS.find(c => t >= c.win[0] && t <= c.win[1]) || CHECKS.find(c => t < c.win[0]);
  const lvlOpts = cur => `<option value="">—</option>` + LEVELS.map(l => `<option value="${l}" ${cur === l ? "selected" : ""}>${l}</option>`).join("");
  panel.innerHTML = `
    <section class="card">
      <div><h2>Цель к июню</h2><p class="sub">Шкала EF SET: балл 1–100 переводится в уровень CEFR.</p></div>
      <div class="grid2">
        <label class="field" for="g-level">Целевой уровень<select id="g-level" ${dis}><option value="">не задан</option>${LEVELS.slice(1).map(l => `<option value="${l}" ${g.lvl === l ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="field" for="g-score">Целевой балл EFSET<input id="g-score" type="number" inputmode="numeric" min="1" max="100" placeholder="${g.lvl ? GOAL_MIN[g.lvl] : "напр. 51"}" value="${S.settings && S.settings.goalScore ? esc(S.settings.goalScore) : ""}" ${dis}></label>
      </div>
      <div class="path" id="goal-path">${goalPath()}</div>
      <div id="scale">${scaleHTML()}</div>
    </section>
    <section class="stack" style="gap:8px">
      <h2>Балл EFSET</h2>
      <div id="chart">${chartSVG()}</div>
    </section>
    <section class="stack" style="gap:10px">
      <div><h2>Контрольные точки</h2><p class="sub">С 1 по 5 число каждого месяца: тест и эссе, по 60 минут.</p></div>
      <div class="checks">${CHECKS.map(c => {
        const ts = testState(c.k), id = "c" + c.k.replace("-", "");
        const open = openChecks.has(c.k) || (!openChecks.size && now && now.k === c.k);
        if (open) openChecks.add(c.k);
        return `<details class="chk" data-k="${c.k}" ${now && now.k === c.k ? 'data-now="1"' : ""} ${open ? "open" : ""}>
          <summary id="${id}-sum">${checkSummary(c)}</summary>
          <div class="chk-body">
            <div class="row">
              <label class="check" for="${id}-test"><input type="checkbox" id="${id}-test" data-k="${c.k}" data-f="testDone" ${ts.testDone ? "checked" : ""} ${dis}> Тест пройден</label>
              <label class="check" for="${id}-essay"><input type="checkbox" id="${id}-essay" data-k="${c.k}" data-f="essayDone" ${ts.essayDone ? "checked" : ""} ${dis}> Эссе написано</label>
            </div>
            <div class="grid2">
              <label class="field" for="${id}-efset">EFSET, балл 1–100<input type="number" inputmode="numeric" min="1" max="100" id="${id}-efset" data-k="${c.k}" data-f="efset" value="${ts.efset ?? ""}" ${dis}></label>
              <label class="field" for="${id}-cefr">Уровень CEFR<select id="${id}-cefr" data-k="${c.k}" data-f="cefr" ${dis}>${lvlOpts(ts.cefr)}</select></label>
              <label class="field" for="${id}-tt">TrackTest<select id="${id}-tt" data-k="${c.k}" data-f="tracktest" ${dis}>${lvlOpts(ts.tracktest)}</select></label>
              <label class="field" for="${id}-dl">DIALANG по навыкам<input type="text" id="${id}-dl" data-k="${c.k}" data-f="dialang" placeholder="Listening B1, Reading B2…" value="${esc(ts.dialang)}" ${dis}></label>
            </div>
            <label class="field" for="${id}-essaytopic">Тема эссе<input type="text" id="${id}-essaytopic" data-k="${c.k}" data-f="essay" value="${esc(ts.essay)}" ${dis}></label>
            <label class="field" for="${id}-note">Выводы: что подтянуть в следующем месяце<textarea id="${id}-note" data-k="${c.k}" data-f="note" ${dis}>${esc(ts.note)}</textarea></label>
          </div></details>`;
      }).join("")}</div>
      <div class="links"><a href="${LINKS.efset}" target="_blank" rel="noopener">EFSET</a><a href="${LINKS.tracktest}" target="_blank" rel="noopener">TrackTest</a><a href="${LINKS.dialang}" target="_blank" rel="noopener">DIALANG</a></div>
    </section>`;
}
function refreshTestsLight(){
  const gp = $("#goal-path"), ch = $("#chart"), sc = $("#scale");
  if (gp) gp.innerHTML = goalPath();
  if (ch) ch.innerHTML = chartSVG();
  if (sc) sc.innerHTML = scaleHTML();
  CHECKS.forEach(c => { const el = document.getElementById("c" + c.k.replace("-", "") + "-sum"); if (el) el.innerHTML = checkSummary(c); });
}

/* ---------- render: plan ---------- */
function renderPlan(){
  const order = [1,2,3,4,5,6,0];
  const rows = order.map(d => {
    const ks = PLAN[d], m = ks.reduce((a,k) => a + A[k].m, 0);
    return `<div class="plan-row"><span class="d">${WDS[d]}</span><span>${ks.map(k => `<span class="tag" style="--c:var(--c-${k})">${A[k].n}</span>`).join("")}</span><span class="m">${m}</span></div>`;
  }).join("");
  const week = order.reduce((a,d) => a + PLAN[d].reduce((b,k) => b + A[k].m, 0), 0);
  const res = {
    tutor:"60 мин, ср и сб. Listening, Reading, Speaking, Grammar.",
    hw:`40 мин, вт и сб. Listening, Reading, Grammar, Writing.`,
    words:"30 мин каждый день после работы, Reword.",
    grammar:"30 мин по будням, English Galaxy.",
    podcast:`45 мин, сб и вс: <a href="${LINKS.bbc}" target="_blank" rel="noopener">BBC Learning English</a>, <a href="${LINKS.bc}" target="_blank" rel="noopener">British Council</a>, <a href="${LINKS.rl}" target="_blank" rel="noopener">RealLife</a>.`,
    reading:"30 мин по будням в метро. Oxford Bookworms, позже финансовые статьи."
  };
  $("#p-plan").innerHTML = `
    <section class="stack" style="gap:10px">
      <div><h2>Неделя по плану</h2><p class="sub">Из листа «Стратегия копия». Минуты в правой колонке.</p></div>
      <div class="sheet">${rows}<div class="plan-foot"><span>Итого за неделю</span><b class="mono">${week} мин ≈ ${hrs(week)} ч</b></div></div>
      <p class="sub">Плюс с 1 по 5 число каждого месяца: тест (<a href="${LINKS.efset}" target="_blank" rel="noopener">EFSET</a>, <a href="${LINKS.tracktest}" target="_blank" rel="noopener">TrackTest</a>, <a href="${LINKS.dialang}" target="_blank" rel="noopener">DIALANG</a>) и эссе с Claude, по 60 минут.</p>
    </section>
    <section class="stack" style="gap:12px">
      <h2>Занятия и ресурсы</h2>
      <div class="res">${ACT.map(a => `<div class="res-row"><span class="tag" style="--c:var(--c-${a.k})">${a.n}</span><p>${res[a.k]}</p></div>`).join("")}</div>
    </section>
    <section class="stack" style="gap:10px">
      <h2>Как пользоваться</h2>
      <ol class="how">
        <li>Каждый день на вкладке «Сегодня» отмечайте сделанное. Минуты и проценты считаются сами.</li>
        <li>Перенесли занятие — отметьте его в тот день, когда сделали: внеплановые занятия тоже засчитываются.</li>
        <li>Праздник или болезнь — включите «Не учитывать этот день», и он не испортит процент.</li>
        <li>1–5 числа — тест и эссе. Результат вносите на вкладке «Тесты», там же задайте цель.</li>
      </ol>
    </section>
    <section class="card backup" id="backup">
      <div><h2>Данные и резервная копия</h2>
      <p class="sub">Отметки хранятся только на этом iPad и работают без интернета. Раз в пару недель сохраняйте копию в «Файлы» — из неё можно восстановить всё на новом устройстве или после удаления приложения.</p></div>
      <p class="sub" style="margin:0">${(() => { const lb = lastBackup(); if (!lb) return "Копию ещё не сохраняли."; const d = new Date(lb); return `Последняя копия: ${d.getDate()} ${MON_G[d.getMonth()]} ${d.getFullYear()}.`; })()}</p>
      <div class="row">
        <button type="button" class="btn primary" id="btn-backup">Сохранить копию</button>
        <button type="button" class="btn" id="btn-restore">Восстановить из файла</button>
        <input type="file" id="imp-file" accept="application/json,.json" hidden>
      </div>
      ${pendingImport ? `<div class="confirm">В файле ${(n => n + " " + plural(n, ["день","дня","дней"]))(Object.values(pendingImport.days).filter(d => d && Array.isArray(d.done) && d.done.length).length)} с отметками${pendingImport.at ? `, копия от ${new Date(pendingImport.at).getDate()} ${MON_G[new Date(pendingImport.at).getMonth()]}` : ""}. Текущие отметки на этом iPad будут заменены.
        <div class="row"><button type="button" class="btn primary" id="btn-import-yes">Заменить данными из файла</button><button type="button" class="btn" id="btn-import-no">Отмена</button></div></div>` : ""}
      ${backupMsg ? `<p class="msg${backupBad ? " bad" : ""}" role="status">${esc(backupMsg)}</p>` : ""}
    </section>`;
}

function renderAll(){
  renderHeader();
  if (tab === "today") renderToday();
  if (tab === "progress") renderProgress();
  if (tab === "tests") renderTests(false);
  if (tab === "plan") renderPlan();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button,[data-tab]");
  if (!b) return;
  if (b.dataset.tab) {
    tab = b.dataset.tab; try { localStorage.setItem("eng-june-tab", tab); } catch (err) {}
    if (b.dataset.open) { openChecks.clear(); openChecks.add(b.dataset.open); }
    if (tab === "tests") { renderHeader(); renderTests(true); } else renderAll();
    const target = b.dataset.scroll && document.getElementById(b.dataset.scroll);
    if (target) target.scrollIntoView({block:"start"}); else window.scrollTo({top:0});
    return;
  }
  if (b.id === "btn-backup") { saveBackup(); return; }
  if (b.id === "btn-restore") { const f = $("#imp-file"); if (f) { f.value = ""; f.click(); } return; }
  if (b.id === "btn-import-yes") { applyImport(); return; }
  if (b.id === "btn-import-no") { pendingImport = null; renderAll(); return; }
  if (b.dataset.toggle) { toggleAct(b.dataset.toggle); return; }
  if (b.dataset.nav) { sel = clampDay(add(sel, Number(b.dataset.nav))); renderAll(); return; }
  if (b.hasAttribute("data-go-today")) { sel = clampDay(todayISO()); renderAll(); return; }
  if (b.dataset.day) { sel = b.dataset.day; tab = "today"; try { localStorage.setItem("eng-june-tab", tab); } catch (err) {} renderAll(); window.scrollTo({top:0}); return; }
  if (b.dataset.tflag) { const k = b.dataset.k, f = b.dataset.tflag; editTest(k, f, !testState(k)[f]); persist("tests/" + k); renderAll(); return; }
});
$("#t-note").addEventListener("input", e => { const v = e.target.value; const d = sel; editDay(d, st => { st.note = v.slice(0, 4000); }); persistSoon("days/" + d, 800); });
$("#t-note").addEventListener("blur", () => { const p = "days/" + sel; if (timers[p]) { clearTimeout(timers[p]); persist(p); } });
$("#t-off").addEventListener("change", e => { editDay(sel, st => { st.off = e.target.checked; }); persist("days/" + sel); renderAll(); });
const tp = $("#p-tests");
tp.addEventListener("toggle", e => { const d = e.target; if (d.matches && d.matches("details.chk")) { d.open ? openChecks.add(d.dataset.k) : openChecks.delete(d.dataset.k); } }, true);
function onTestInput(e){
  const el = e.target;
  if (el.id === "g-level") {
    S.settings = {...S.settings, goalLevel: el.value};
    persist("meta/settings"); renderHeader(); refreshTestsLight();
    const gs = $("#g-score"); if (gs) gs.placeholder = el.value ? GOAL_MIN[el.value] : "напр. 51";
    return;
  }
  if (el.id === "g-score") {
    const v = parseInt(el.value, 10);
    S.settings = {...S.settings, goalScore: v >= 1 && v <= 100 ? v : null};
    persistSoon("meta/settings", 700); refreshTestsLight(); return;
  }
  const k = el.dataset.k, f = el.dataset.f; if (!k || !f) return;
  let v;
  if (el.type === "checkbox") v = el.checked;
  else if (f === "efset") { const n = parseInt(el.value, 10); v = n >= 1 && n <= 100 ? n : null; }
  else v = el.value.slice(0, 2000);
  editTest(k, f, v);
  if (el.type === "checkbox" || el.tagName === "SELECT") persist("tests/" + k); else persistSoon("tests/" + k, 700);
  refreshTestsLight(); renderHeader();
}
tp.addEventListener("input", e => { if (e.target.type !== "checkbox" && e.target.tagName !== "SELECT") onTestInput(e); });
tp.addEventListener("change", e => { if (e.target.type === "checkbox" || e.target.tagName === "SELECT") onTestInput(e); });
tp.addEventListener("focusout", () => { setTimeout(() => { if (testsDirty && !tp.contains(document.activeElement)) renderTests(true); Object.keys(timers).forEach(p => { if (p.startsWith("tests/") || p === "meta/settings") { clearTimeout(timers[p]); persist(p); } }); }, 0); });

let rz = null;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (tab === "tests") { const ch = $("#chart"); if (ch) ch.innerHTML = chartSVG(); } }, 150); });

document.addEventListener("change", e => { if (e.target && e.target.id === "imp-file" && e.target.files && e.target.files[0]) readImport(e.target.files[0]); });

// a new day starts while the app stays open on the iPad
let lastToday = todayISO();
setInterval(() => { const t = todayISO(); if (t !== lastToday) { if (sel === clampDay(lastToday)) sel = clampDay(t); lastToday = t; renderAll(); } }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { const t = todayISO(); if (t !== lastToday) { if (sel === clampDay(lastToday)) sel = clampDay(t); lastToday = t; } renderAll(); } });

load();
renderAll();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("./sw.js").catch(() => {});
})();
</script>

</body>
</html>
